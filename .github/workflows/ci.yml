name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", "1.25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/interop/package-lock.json
      - run: npm ci
        working-directory: internal/interop
      - run: npx playwright install --with-deps chromium
        working-directory: internal/interop
      - run: go run ./internal/tools/emit_vectors.go > internal/interop/go-vectors.json
      - run: npm run verify
        working-directory: internal/interop
      - run: npm test
        working-directory: internal/interop
